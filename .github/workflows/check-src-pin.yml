name: Check src pin

# Guards the one invariant that `nix build` alone cannot be trusted to catch:
# package.nix's `hash` must be the hash of the tag `rev = "v${version}"` names.
#
# A fixed-output derivation is keyed on (output hash, name), so a stale hash
# left over from a previous version can be satisfied by a source tree already
# present in the store or a binary cache — the fetch is skipped, the new rev is
# never looked at, and the build happily produces the OLD code under the NEW
# version number. package.nix defends against this by embedding ${version} in
# the fetch's `name`, but that only makes the failure loud on a machine that
# lacks the stale path. This job makes it loud everywhere, on every PR, without
# building the (slow) Rails app.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  src-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Pinned src hash must match rev v<version>
        run: |
          set -euo pipefail

          version=$(grep -oP '^\s*version\s*=\s*"\K[^"]+' package.nix | head -1)
          pinned=$(grep -oP '^\s*hash\s+=\s*"\Ksha256-[^"]+' package.nix | head -1)

          if [ -z "$version" ] || [ -z "$pinned" ]; then
            echo "::error::could not read version/hash out of package.nix (did the formatting change? update this check and scripts/update-gemset.sh together)"
            exit 1
          fi
          echo "package.nix    version=$version"
          echo "package.nix    hash=$pinned"

          actual=$(nix run nixpkgs#nix-prefetch-github -- \
                     --rev "v$version" we-promise sure \
                   | nix run nixpkgs#jq -- -r '.hash')
          echo "upstream v$version hash=$actual"

          if [ "$pinned" != "$actual" ]; then
            echo "::error::src hash does not match rev v$version. The build would reuse a source tree from a DIFFERENT version and mislabel it as $version. Fix with: ./scripts/update-gemset.sh $version"
            exit 1
          fi
          echo "OK: src pin is consistent with v$version"
